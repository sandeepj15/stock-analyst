[project]
name = "signalforge"
version = "0.1.0"
description = "SignalForge - evidence-first market research and decision-support platform (see SPEC.md)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.1",
    "arq>=0.26",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.1",
    "yfinance>=0.2.44",
    "requests>=2.31",
    "tradingview-ta>=3.3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
    "fakeredis>=2.20",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is enforced via `line-length` + formatter instead.
# B008: FastAPI's `Depends()`/`Query()` in defaults is the documented,
# intended usage pattern - not a real "function call in default" bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["apps/web", ".venv"]
